name: Build fleth kmods

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPENWRT_COMMIT: "13ff2256e5dd9bc070f9a9c6a673bff4a9191837"
  MTK_COMMIT: "dceb45f8cb945bce16f0e09f8d2cd974c9f0ce58"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext libncurses-dev libssl-dev python3-distutils python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev ccache git

      - name: Restore repository cache
        id: cache-repos
        uses: actions/cache@v4
        with:
          path: |
            repo-cache/mtk-openwrt-feeds.tar.gz
          key: mtkfeeds-${{ env.MTK_COMMIT }}

      - name: Clone MTK feeds into repo-cache
        if: steps.cache-repos.outputs.cache-hit != 'true'
        run: |
          mkdir -p repo-cache
          git clone --branch master https://git01.mediatek.com/openwrt/feeds/mtk-openwrt-feeds mtk-clone
          cd mtk-clone && git checkout ${{ env.MTK_COMMIT }} && cd ..
          tar -czf repo-cache/mtk-openwrt-feeds.tar.gz mtk-clone
          rm -rf mtk-clone

      - name: Run builder (wifimgr / standard, kernel-matched)
        run: |
          chmod +x ./builder-wifimgr-universal.sh
          ./builder-wifimgr-universal.sh
        env:
          OPENWRT_COMMIT: ${{ env.OPENWRT_COMMIT }}
          MTK_COMMIT: ${{ env.MTK_COMMIT }}

      - name: Collect kmod artifacts
        run: |
          mkdir -p kmod-out
          echo "=== searching for kmods ==="
          find openwrt/bin -name 'kmod-ip6-tunnel*.apk' -exec cp -v {} kmod-out/ \; || true
          find openwrt/bin -name 'kmod-nat46*.apk'      -exec cp -v {} kmod-out/ \; || true
          echo "=== also list kmods dir for reference ==="
          find openwrt/bin -path '*kmods*' -name '*.apk' | head -50 || true
          echo "=== collected ==="
          ls -la kmod-out
          test -n "$(ls -A kmod-out)" || { echo 'NO KMODS FOUND'; exit 1; }
          (cd kmod-out && sha256sum * > sha256sums)
          cat kmod-out/sha256sums

      - name: Publish kmods release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fleth-kmods
          name: "fleth kmods (ip6-tunnel + nat46)"
          body: |
            kmod-ip6-tunnel + kmod-nat46 built at OPENWRT_COMMIT=13ff2256e5 / MTK=dceb45f8
            (matches the deployed firmware kernel 6.12.87). Kernel-matched, loadable as-is.

            Install on the router:
            ```
            apk add --allow-untrusted /tmp/kmod-ip6-tunnel-*.apk /tmp/kmod-nat46-*.apk
            ```
          files: kmod-out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
